name: arena-local-sandbox
services:
  postgres:
    image: postgres:16@sha256:11a9d238fbb48bab14599c57e41123254452b1a2d93c6c8595bce96f346bd082
    environment:
      POSTGRES_USER: arena_local
      POSTGRES_DB: arena_local
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:?Use scripts/local-dev.mjs}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arena_local -d arena_local"]
      interval: 2s
      timeout: 3s
      retries: 30
  storage:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY_ID:?Use scripts/local-dev.mjs}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_ACCESS_KEY:?Use scripts/local-dev.mjs}
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3001
    ports:
      - "127.0.0.1:59000:9000"
      - "127.0.0.1:59001:9001"
    volumes:
      - storage-data:/data
volumes:
  postgres-data:
  storage-data:
